# Plain static site: no build step. Netlify publishes this folder as is.
[build]
  publish = "."

# Always fetch the newest copy of these, so installed apps find updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
